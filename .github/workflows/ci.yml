name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: MAC_DRY_RUN=1 VISION_FAKE=fixtures make test
      - run: MAC_DRY_RUN=1 VISION_FAKE=fixtures make e2e
