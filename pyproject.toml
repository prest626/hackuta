[project]
name = "homeward"
version = "0.0.0"
description = "Homeward hackathon prototype. Not a medical device."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pyyaml",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "openai",
    "google-genai",
]

[dependency-groups]
dev = ["pytest", "jsonschema"]
chert = ["livekit-agents==1.8.12", "livekit-plugins-openai==1.8.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
