<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homeward</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p class="banner">Homeward prototype · mock patients · not a medical device.</p>
  <main>
    <section>
      <h1>Patients</h1>
      <div id="patients"></div>
    </section>
    <section>
      <h1>Call</h1>
      <form id="call-now-form">
        <label>Day
          <select id="call-day" name="day_index">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
        <button type="submit" id="call-now">Call now · day 1</button>
        <p id="call-chip" class="chip" role="status">ended</p>
        <p id="call-now-note"></p>
      </form>
      <div id="detail">Select a patient.</div>
    </section>
    <section>
      <h1>Pending escalations</h1>
      <label>Nurse name <input id="nurse-name" name="nurse_name" autocomplete="name"></label>
      <div id="queue"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
